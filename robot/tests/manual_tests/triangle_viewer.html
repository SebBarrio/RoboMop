<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboMop Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Core Palette */
            --bg-color: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-tertiary: #52525b;
            
            /* Glassmorphism */
            --glass-bg: rgba(20, 20, 20, 0.30);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --glass-blur: 24px;
            
            /* Accents */
            --accent: #3b82f6; /* Blue */
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.3);
            
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.3);
            
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.3);

            /* Grid */
            --grid-line: #27272a;
            --grid-axis: #3f3f46;

            /* UI Properties */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.3);
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-highlight: rgba(0, 0, 0, 0.02);
            
            --grid-line: #e2e8f0;
            --grid-axis: #cbd5e1;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active { cursor: grabbing; }

        /* HUD Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            grid-template-areas: 
                "top-left    top-center    top-right"
                "mid-left    mid-center    mid-right"
                "btm-left    btm-center    btm-right";
        }

        /* Areas */
        .area-top-left { grid-area: top-left; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
        .area-top-right { grid-area: top-right; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
        .area-btm-left { grid-area: btm-left; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; }
        .area-btm-right { grid-area: btm-right; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; align-items: flex-end; }
        
        /* Mobile/Responsive */
        @media (max-width: 768px) {
            #ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                grid-template-areas: "top-left" "top-right" "btm-left" "btm-right";
                overflow-y: auto;
            }
            .area-top-right { align-items: flex-start; }
            .area-btm-right { align-items: flex-start; }
        }

        /* Panels & Cards */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-md);
            padding: 16px;
            pointer-events: auto;
            transition: transform var(--transition), box-shadow var(--transition);
            width: 100%;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(255,255,255,0.15);
        }

        /* Typography */
        h2 {
            margin: 0 0 12px 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 8px;
            min-height: 24px;
        }
        .stat-row:last-child { margin-bottom: 0; }

        .stat-label { color: var(--text-secondary); font-weight: 500; }
        .stat-value { font-family: var(--font-mono); color: var(--text-primary); font-weight: 600; }

        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            font-size: 11px;
            font-weight: 600;
            gap: 6px;
        }

        .indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            position: relative;
        }
        
        .indicator::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(2px);
            transition: background-color 0.3s;
        }

        .indicator.success { background: var(--success); }
        .indicator.success::after { background: var(--success); }
        
        .indicator.warning { background: var(--warning); }
        .indicator.warning::after { background: var(--warning); }
        
        .indicator.danger { background: var(--danger); }
        .indicator.danger::after { background: var(--danger); }
        
        .indicator.neutral { background: var(--text-tertiary); }

        /* Controls */
        .btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            pointer-events: auto;
        }

        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: var(--accent);
            border-color: transparent;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 15px var(--danger-glow);
        }

        .btn-icon { padding: 8px; border-radius: var(--radius-md); width: 36px; height: 36px; }

        .btn-group {
            background: rgba(0,0,0,0.2);
            padding: 3px;
            border-radius: var(--radius-md);
            display: flex;
            gap: 2px;
        }

        .btn-group .btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border-radius: var(--radius-sm);
        }

        .btn-group .btn.active {
            background: var(--glass-bg);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Sliders */
        .slider-group { margin-top: 16px; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; color: var(--text-secondary); }
        
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--glass-border);
            border-radius: 2px;
        }

        /* D-Pad */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }
        
        .dpad-btn {
            aspect-ratio: 1;
            font-size: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }
        .dpad-btn:active { background: var(--accent); color: white; }

        /* Legend */
        .legend-row { display: flex; align-items: center; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; }

        /* Scrollbar for sidebar if needed */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }

    </style>
</head>
<body>

<div id="container">
    <canvas id="mapCanvas"></canvas>
    
    <div id="ui-layer">
        
        <!-- Top Left: Status -->
        <div class="area-top-left">
            <div class="card" style="width: auto; min-width: 240px;">
                <h2>System Status</h2>
                <div class="stat-row">
                    <span class="stat-label">Server</span>
                    <div class="badge">
                        <span id="server-dot" class="indicator neutral"></span>
                        <span id="server-text">Connecting...</span>
                    </div>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Robot</span>
                    <div class="badge">
                        <span id="robot-dot" class="indicator neutral"></span>
                        <span id="robot-text">Waiting...</span>
                    </div>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Performance</span>
                    <span class="stat-value"><span id="fps-value">--</span> FPS</span>
                </div>
            </div>

            <div class="card" style="width: auto; min-width: 240px;">
                <button id="estop-btn" class="btn btn-danger" style="width: 100%; justify-content: center; font-weight: 700; letter-spacing: 0.05em;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    E-STOP (SPACE)
                </button>
            </div>
        </div>

        <!-- Top Right: Actions -->
        <div class="area-top-right">
            <div style="display: flex; gap: 10px;">
                 <button id="center-btn" class="btn btn-icon" title="Recenter Map">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme">
                    <!-- Sun -->
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon -->
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
           
            <div class="card" style="width: auto;">
                <h2>Map Legend</h2>
                <div class="legend-row"><div class="legend-dot" style="background: var(--accent)"></div>Robot</div>
                <div class="legend-row"><div class="legend-dot" style="background: var(--danger)"></div>Trajectory</div>
                <div class="legend-row"><div class="legend-dot" style="background: var(--accent); border: 1px dashed rgba(255,255,255,0.5)"></div>Path Plan</div>
                <div class="legend-row"><div class="legend-dot" style="background: cyan"></div>Lidar</div>
            </div>
        </div>

        <!-- Bottom Left: Telemetry -->
        <div class="area-btm-left">
            <div class="card">
                <h2>Telemetry</h2>
                <div class="stat-row">
                    <span class="stat-label">Position (X, Y)</span>
                    <span class="stat-value" id="pose-value">0.00, 0.00</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Heading</span>
                    <span class="stat-value" id="heading-value">0.0°</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">IMU Yaw</span>
                    <span class="stat-value" id="imu-value">--</span>
                </div>
            </div>
        </div>

        <!-- Bottom Right: Controls -->
        <div class="area-btm-right">
            <div class="card">
                <h2>Control Mode</h2>
                
                <div class="btn-group">
                    <button id="mode-clean-btn" class="btn active">Clean</button>
                    <button id="mode-explore-btn" class="btn">Explore</button>
                    <button id="mode-manual-btn" class="btn">Manual</button>
                </div>

                <div id="manual-controls" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border);">
                    
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Linear Speed</span>
                            <span id="linear-val" class="stat-value">0.2 m/s</span>
                        </div>
                        <input type="range" id="linear-slider" min="0.1" max="0.5" step="0.05" value="0.2">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Angular Speed</span>
                            <span id="angular-val" class="stat-value">0.5 r/s</span>
                        </div>
                        <input type="range" id="angular-slider" min="0.2" max="1.5" step="0.1" value="0.5">
                    </div>

                    <div class="dpad">
                        <div></div>
                        <button class="btn dpad-btn" id="btn-fwd">▲</button>
                        <div></div>
                        <button class="btn dpad-btn" id="btn-left">◀</button>
                        <button class="btn dpad-btn" id="btn-stop">■</button>
                        <button class="btn dpad-btn" id="btn-right">▶</button>
                        <div></div>
                        <button class="btn dpad-btn" id="btn-back">▼</button>
                        <div></div>
                    </div>
                    
                    <div style="text-align: center; font-size: 10px; color: var(--text-tertiary); margin-top: 12px;">
                        Keyboard: WASD or Arrow Keys
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // Configuration
    const WS_URL = `ws://${window.location.hostname}:8765`;
    
    // State
    const state = {
        pose: { x: 0, y: 0, theta: 0 },
        trajectory: [],
        plannedVertices: [],
        lidarScan: [],
        map: null,
        imuHeadingDeg: null,
        connected: false,
        lastUpdate: 0
    };

    // Theme Management
    const themeConfig = {
        dark: {
            bg: '#0a0a0a',
            grid: '#27272a',
            axis: '#3f3f46',
            robot: '#3b82f6',
            trajectory: '#ef4444',
            plan: '#3b82f6',
            lidar: '#06b6d4',
            mapOccupied: [200, 200, 200], // Lighter walls in dark mode for contrast
            mapFree: [30, 30, 30],
        },
        light: {
            bg: '#f8fafc',
            grid: '#e2e8f0',
            axis: '#cbd5e1',
            robot: '#2563eb',
            trajectory: '#dc2626',
            plan: '#2563eb',
            lidar: '#0891b2',
            mapOccupied: [0, 0, 0],
            mapFree: [255, 255, 255],
        }
    };

    let currentTheme = localStorage.getItem('theme') || 'dark';
    
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        const sun = btn.querySelector('.sun-icon');
        const moon = btn.querySelector('.moon-icon');
        
        if (theme === 'dark') {
            sun.style.display = 'block';
            moon.style.display = 'none';
        } else {
            sun.style.display = 'none';
            moon.style.display = 'block';
        }
        
        localStorage.setItem('theme', theme);
        currentTheme = theme;
        
        if (state.map) updateMapTexture();
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    applyTheme(currentTheme);

    // Viewport
    const view = {
        scale: 100,
        centerX: 0,
        centerY: 0,
        isDragging: false,
        lastMouseX: 0,
        lastMouseY: 0
    };

    // DOM Elements
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const serverDot = document.getElementById('server-dot');
    const serverText = document.getElementById('server-text');
    const robotDot = document.getElementById('robot-dot');
    const robotText = document.getElementById('robot-text');
    const fpsValue = document.getElementById('fps-value');
    const poseValue = document.getElementById('pose-value');
    const headingValue = document.getElementById('heading-value');
    const imuValue = document.getElementById('imu-value');
    const centerBtn = document.getElementById('center-btn');
    const estopBtn = document.getElementById('estop-btn');

    // Stats
    let frameCount = 0;
    let lastFpsTime = 0;

    // E-Stop Logic
    let estopEnabled = false;
    
    // Manual Control Logic
    let controlMode = 'clean';
    let maxLinear = 0.2;
    let maxAngular = 0.5;
    
    const modeCleanBtn = document.getElementById('mode-clean-btn');
    const modeExploreBtn = document.getElementById('mode-explore-btn');
    const modeManualBtn = document.getElementById('mode-manual-btn');
    const manualControls = document.getElementById('manual-controls');
    
    const linearSlider = document.getElementById('linear-slider');
    const angularSlider = document.getElementById('angular-slider');
    const linearVal = document.getElementById('linear-val');
    const angularVal = document.getElementById('angular-val');

    function updateModeUI() {
        // Reset all buttons
        modeCleanBtn.classList.remove('active');
        modeExploreBtn.classList.remove('active');
        modeManualBtn.classList.remove('active');
        
        if (controlMode === 'clean') {
            modeCleanBtn.classList.add('active');
            manualControls.style.display = 'none';
        } else if (controlMode === 'explore') {
            modeExploreBtn.classList.add('active');
            manualControls.style.display = 'none';
        } else {
            modeManualBtn.classList.add('active');
            manualControls.style.display = 'block';
        }
    }

    function setMode(mode) {
        controlMode = mode;
        updateModeUI();
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'control', command: 'set_mode', mode: mode }));
        }
    }

    modeCleanBtn.addEventListener('click', () => setMode('clean'));
    modeExploreBtn.addEventListener('click', () => setMode('explore'));
    modeManualBtn.addEventListener('click', () => setMode('manual'));

    linearSlider.addEventListener('input', (e) => {
        maxLinear = parseFloat(e.target.value);
        linearVal.innerText = `${maxLinear} m/s`;
    });

    angularSlider.addEventListener('input', (e) => {
        maxAngular = parseFloat(e.target.value);
        angularVal.innerText = `${maxAngular} r/s`;
    });

    // Manual Drive Logic
    let currentLinear = 0;
    let currentAngular = 0;
    const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowleft: false, arrowdown: false, arrowright: false };

    function sendVelocity() {
        if (controlMode !== 'manual' || !ws || ws.readyState !== WebSocket.OPEN) return;
        
        let lin = 0;
        let ang = 0;

        if (keys.w || keys.arrowup) lin += maxLinear;
        if (keys.s || keys.arrowdown) lin -= maxLinear;
        if (keys.a || keys.arrowleft) ang += maxAngular;
        if (keys.d || keys.arrowright) ang -= maxAngular;

        if (lin !== currentLinear || ang !== currentAngular) {
            currentLinear = lin;
            currentAngular = ang;
            ws.send(JSON.stringify({ 
                type: 'control', 
                command: 'velocity', 
                linear: currentLinear, 
                angular: currentAngular 
            }));
        }
    }
    
    // Button handlers
    const padBtns = {
        'btn-fwd': { lin: 1, ang: 0 },
        'btn-back': { lin: -1, ang: 0 },
        'btn-left': { lin: 0, ang: 1 },
        'btn-right': { lin: 0, ang: -1 },
        'btn-stop': { lin: 0, ang: 0 }
    };

    Object.keys(padBtns).forEach(id => {
        const btn = document.getElementById(id);
        const val = padBtns[id];
        
        const start = (e) => {
            e.preventDefault();
            if (controlMode !== 'manual') return;
            if (id === 'btn-stop') {
                keys.w = keys.s = keys.a = keys.d = false;
                currentLinear = 0;
                currentAngular = 0;
            } else {
                if (val.lin !== 0) currentLinear = val.lin * maxLinear;
                if (val.ang !== 0) currentAngular = val.ang * maxAngular;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ 
                    type: 'control', 
                    command: 'velocity', 
                    linear: currentLinear, 
                    angular: currentAngular 
                }));
            }
        };

        const end = (e) => {
             e.preventDefault();
             if (controlMode !== 'manual') return;
             currentLinear = 0;
             currentAngular = 0;
             if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ 
                    type: 'control', 
                    command: 'velocity', 
                    linear: 0, 
                    angular: 0 
                }));
            }
        };

        if (id !== 'btn-stop') {
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
        } else {
            btn.addEventListener('click', start);
        }
    });

    window.addEventListener('keydown', e => {
        if (e.repeat) return;
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) {
            keys[k] = true;
            sendVelocity();
        }
    });

    window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) {
            keys[k] = false;
            sendVelocity();
        }
    });

    function setEstopState(enabled) {
        estopEnabled = enabled;
        if (estopEnabled) {
             estopBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                RESUME (SPACE)`;
             estopBtn.className = 'btn btn-primary';
             estopBtn.style.backgroundColor = 'var(--success)';
        } else {
             estopBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                     <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                     <line x1="12" y1="9" x2="12" y2="13"></line>
                     <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                E-STOP (SPACE)`;
             estopBtn.className = 'btn btn-danger';
             estopBtn.style.backgroundColor = '';
        }
    }

    function toggleEstop() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const newState = !estopEnabled;
        setEstopState(newState);
        ws.send(JSON.stringify({ type: 'estop', enabled: newState }));
    }

    estopBtn.addEventListener('click', toggleEstop);

    window.addEventListener('keydown', e => {
        if (e.code === 'Space') {
            e.preventDefault();
            toggleEstop();
        }
    });

    // Resize Handler
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    canvas.addEventListener('mousedown', e => {
        view.isDragging = true;
        view.lastMouseX = e.clientX;
        view.lastMouseY = e.clientY;
    });

    window.addEventListener('mousemove', e => {
        if (view.isDragging) {
            const dx = e.clientX - view.lastMouseX;
            const dy = e.clientY - view.lastMouseY;
            view.centerX -= dx / view.scale;
            view.centerY += dy / view.scale;
            view.lastMouseX = e.clientX;
            view.lastMouseY = e.clientY;
        }
    });

    window.addEventListener('mouseup', () => view.isDragging = false);
    window.addEventListener('mouseleave', () => view.isDragging = false);
    
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoomFactor = 1.1;
        if (e.deltaY < 0) {
            view.scale *= zoomFactor;
        } else {
            view.scale /= zoomFactor;
        }
    }, { passive: false });

    centerBtn.addEventListener('click', () => {
        view.centerX = state.pose.x;
        view.centerY = state.pose.y;
    });

    // Coordinate Transform
    function worldToScreen(x, y) {
        const screenX = (x - view.centerX) * view.scale + canvas.width / 2;
        const screenY = -(y - view.centerY) * view.scale + canvas.height / 2;
        return { x: screenX, y: screenY };
    }

    // Map Decompression
    async function processMapData(mapPayload) {
        try {
            const binaryString = atob(mapPayload.data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            let gridData = bytes;
            if (mapPayload.encoding === 'gzip+base64') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                const buffer = await new Response(ds.readable).arrayBuffer();
                gridData = new Uint8Array(buffer);
            }

            state.map = {
                width: mapPayload.width,
                height: mapPayload.height,
                resolution: mapPayload.resolution,
                origin: mapPayload.origin,
                data: gridData
            };
            
            updateMapTexture();
            
        } catch (e) {
            console.error("Error processing map:", e);
        }
    }

    let mapTexture = null;
    
    function updateMapTexture() {
        if (!state.map) return;
        
        const { width, height, data } = state.map;
        const offCanvas = document.createElement('canvas');
        offCanvas.width = width;
        offCanvas.height = height;
        const offCtx = offCanvas.getContext('2d');
        const imgData = offCtx.createImageData(width, height);
        const buf = imgData.data;
        
        const isDark = currentTheme === 'dark';
        const theme = themeConfig[currentTheme];
        
        for (let i = 0; i < width * height; i++) {
            const val = data[i];
            const idx = i * 4;
            
            if (val === 0) {
                // Unknown
                if (isDark) {
                     buf[idx] = 40; buf[idx+1] = 40; buf[idx+2] = 40; buf[idx+3] = 0; 
                } else {
                     buf[idx] = 240; buf[idx+1] = 240; buf[idx+2] = 240; buf[idx+3] = 0; 
                }
            } else if (val > 127) {
                // Occupied
                const c = theme.mapOccupied;
                buf[idx] = c[0]; buf[idx+1] = c[1]; buf[idx+2] = c[2]; buf[idx+3] = 255;
            } else {
                // Free
                const c = theme.mapFree;
                buf[idx] = c[0]; buf[idx+1] = c[1]; buf[idx+2] = c[2]; buf[idx+3] = 255;
            }
        }
        
        offCtx.putImageData(imgData, 0, 0);
        mapTexture = offCanvas;
    }

    // WebSocket
    let ws;

    function connect() {
        ws = new WebSocket(WS_URL);
        
        ws.onopen = () => {
            state.connected = true;
            serverDot.className = 'indicator success';
            serverText.innerText = 'Connected';
            console.log('Connected to viewer server');
        };
        
        ws.onclose = () => {
            state.connected = false;
            serverDot.className = 'indicator danger';
            serverText.innerText = 'Disconnected';
            setTimeout(connect, 1000);
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'estop') {
                    setEstopState(msg.enabled);
                }
                
                if (msg.type === 'triangle_update') {
                    if (msg.pose) {
                        state.pose = msg.pose;
                        if (frameCount < 10 && state.pose.x !== 0) {
                             view.centerX = state.pose.x;
                             view.centerY = state.pose.y;
                        }
                    }
                    if (msg.trajectory) state.trajectory = msg.trajectory;
                    if (msg.plannedVertices) state.plannedVertices = msg.plannedVertices;
                    if (msg.lidarScan) state.lidarScan = msg.lidarScan;
                    if (msg.imuHeadingDeg !== undefined) state.imuHeadingDeg = msg.imuHeadingDeg;
                    
                    if (msg.map) {
                        await processMapData(msg.map);
                    }
                    
                    state.lastUpdate = Date.now();
                }
            } catch (e) {
                console.error("Error parsing msg:", e);
            }
        };
    }

    connect();

    // Rendering
    function drawGrid() {
        const theme = themeConfig[currentTheme];
        const gridSize = 1.0;
        const startX = Math.floor((view.centerX - (canvas.width/2)/view.scale) / gridSize) * gridSize;
        const endX = Math.ceil((view.centerX + (canvas.width/2)/view.scale) / gridSize) * gridSize;
        const startY = Math.floor((view.centerY - (canvas.height/2)/view.scale) / gridSize) * gridSize;
        const endY = Math.ceil((view.centerY + (canvas.height/2)/view.scale) / gridSize) * gridSize;

        ctx.strokeStyle = theme.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();

        for (let x = startX; x <= endX; x += gridSize) {
            const p = worldToScreen(x, 0);
            ctx.moveTo(p.x, 0);
            ctx.lineTo(p.x, canvas.height);
        }
        for (let y = startY; y <= endY; y += gridSize) {
            const p = worldToScreen(0, y);
            ctx.moveTo(0, p.y);
            ctx.lineTo(canvas.width, p.y);
        }
        ctx.stroke();

        // Axes
        ctx.strokeStyle = theme.axis;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const p0 = worldToScreen(0, 0);
        ctx.moveTo(0, p0.y);
        ctx.lineTo(canvas.width, p0.y);
        ctx.moveTo(p0.x, 0);
        ctx.lineTo(p0.x, canvas.height);
        ctx.stroke();
    }

    function drawMap() {
        if (!state.map || !mapTexture) return;
        
        const { resolution, origin } = state.map;
        const worldX = origin.x;
        const worldY = origin.y; 
        
        const topLeftWorld = { x: worldX, y: worldY + state.map.height * resolution };
        const pTopLeft = worldToScreen(topLeftWorld.x, topLeftWorld.y);
        
        const screenWidth = state.map.width * resolution * view.scale;
        const screenHeight = state.map.height * resolution * view.scale;
        
        ctx.save();
        ctx.globalAlpha = 0.8;
        
        ctx.translate(pTopLeft.x, pTopLeft.y + screenHeight);
        ctx.scale(1, -1);
        
        ctx.drawImage(mapTexture, 0, 0, screenWidth, screenHeight);
        
        ctx.restore();
    }

    function drawTrajectory() {
        if (state.trajectory.length < 2) return;
        const theme = themeConfig[currentTheme];
        ctx.strokeStyle = theme.trajectory;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const start = worldToScreen(state.trajectory[0][0], state.trajectory[0][1]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < state.trajectory.length; i++) {
            const p = worldToScreen(state.trajectory[i][0], state.trajectory[i][1]);
            ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }

    function drawPlannedPath() {
        if (state.plannedVertices.length < 2) return;
        const theme = themeConfig[currentTheme];
        ctx.strokeStyle = theme.plan;
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        const v = state.plannedVertices;
        const start = worldToScreen(v[0][0], v[0][1]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < v.length; i++) {
            const p = worldToScreen(v[i][0], v[i][1]);
            ctx.lineTo(p.x, p.y);
        }
        if (v.length > 2) { 
             const end = worldToScreen(v[0][0], v[0][1]);
             ctx.lineTo(end.x, end.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawLidar() {
        if (!state.lidarScan.length) return;
        const theme = themeConfig[currentTheme];
        ctx.fillStyle = theme.lidar;
        const pose = state.pose;
        
        for (const point of state.lidarScan) {
            const angle = point[0];
            const dist = point[1];
            const wx = pose.x + dist * Math.cos(pose.theta + angle);
            const wy = pose.y + dist * Math.sin(pose.theta + angle);
            const p = worldToScreen(wx, wy);
            ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
        }
    }

    function drawRobot() {
        const theme = themeConfig[currentTheme];
        const p = worldToScreen(state.pose.x, state.pose.y);
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-state.pose.theta);
        
        // Body
        ctx.fillStyle = theme.robot;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Shadow/Glow
        ctx.shadowColor = theme.robot;
        ctx.shadowBlur = 15;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Heading line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, 0);
        ctx.stroke();
        
        ctx.restore();
    }

    function loop() {
        const now = Date.now();
        frameCount++;
        if (now - lastFpsTime >= 1000) {
            fpsValue.innerText = frameCount;
            frameCount = 0;
            lastFpsTime = now;
        }
        
        poseValue.innerText = `${state.pose.x.toFixed(2)}, ${state.pose.y.toFixed(2)}`;
        headingValue.innerText = `${(state.pose.theta * 180 / Math.PI).toFixed(1)}°`;
        imuValue.innerText = state.imuHeadingDeg !== null ? `${state.imuHeadingDeg.toFixed(1)}°` : '--';

        // Robot Status Logic
        const timeSinceUpdate = now - state.lastUpdate;
        if (state.lastUpdate === 0) {
            robotDot.className = 'indicator neutral';
            robotText.innerText = 'Waiting...';
        } else if (timeSinceUpdate < 3000) {
            robotDot.className = 'indicator success';
            robotText.innerText = 'Active';
        } else if (timeSinceUpdate < 10000) {
            robotDot.className = 'indicator warning';
            robotText.innerText = 'Stale';
        } else {
            robotDot.className = 'indicator danger';
            robotText.innerText = 'Lost';
        }

        const theme = themeConfig[currentTheme];
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid();
        drawMap();
        drawPlannedPath();
        drawTrajectory();
        drawLidar();
        drawRobot();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
