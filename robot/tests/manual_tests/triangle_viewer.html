<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboMop Triangle Viewer</title>
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #4caf50;
            --accent-hover: #45a049;
            --danger: #f44336;
            --warning: #ff9800;
            --grid-color: #2a2a2a;
            --grid-axis: #444;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --card-radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(0, 0, 0, 0.06);
            --accent: #10b981;
            --accent-hover: #059669;
            --grid-color: #e5e7eb;
            --grid-axis: #d1d5db;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition), color var(--transition);
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .panel-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: var(--card-radius);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            min-width: 220px;
            transition: transform 0.2s ease, background-color var(--transition), border-color var(--transition);
        }

        .panel:hover {
            transform: translateY(-1px);
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-family: "JetBrains Mono", "SF Mono", monospace;
            font-weight: 600;
            color: var(--text-color);
        }

        /* Status Indicators */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            font-size: 11px;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .dot.connected, .dot.active { background-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .dot.stale { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .dot.disconnected, .dot.lost { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* Controls */
        .btn {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            pointer-events: auto;
            box-shadow: var(--shadow);
        }

        .btn:hover {
            background: var(--panel-border);
            border-color: var(--text-secondary);
        }

        .btn:active {
            transform: scale(0.98);
        }
        
        .icon-btn {
            padding: 8px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
        }

        /* Legend */
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            margin-top: 6px;
            color: var(--text-secondary);
        }

        .color-box {
            width: 10px;
            height: 10px;
            margin-right: 8px;
            border-radius: 3px;
        }

        /* Utilities */
        .shortcut {
            background: rgba(128,128,128,0.2);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 4px;
        }

        /* SVGs */
        svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

    </style>
</head>
<body>

<div id="container">
    <canvas id="mapCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="top-bar">
            <div class="panel-container">
                <div class="panel">
                    <h1>System Status</h1>
                    <div class="stat-row">
                        <span class="stat-label">Viewer</span>
                        <div class="status-badge">
                            <span id="server-dot" class="dot disconnected"></span>
                            <span id="server-text">Disconnected</span>
                        </div>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Robot</span>
                        <div class="status-badge">
                            <span id="robot-dot" class="dot lost"></span>
                            <span id="robot-text">Silent</span>
                        </div>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">FPS</span>
                        <span class="stat-value" id="fps-value">--</span>
                    </div>
                </div>

                <div class="panel">
                    <h1>Telemetry</h1>
                    <div class="stat-row">
                        <span class="stat-label">Position</span>
                        <span class="stat-value" id="pose-value">--</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Heading</span>
                        <span class="stat-value" id="heading-value">--</span>
                    </div>
                     <div class="stat-row">
                        <span class="stat-label">IMU</span>
                        <span class="stat-value" id="imu-value">--</span>
                    </div>
                </div>
            </div>

            <div class="panel-container" style="align-items: flex-end;">
                <button id="theme-toggle" class="btn icon-btn" aria-label="Toggle Theme">
                    <!-- Sun Icon -->
                    <svg class="sun-icon" viewBox="0 0 24 24" style="display: none;">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.79 1.79c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.79 1.79c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41l-1.79-1.79zm1.41-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.79 1.79c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.79-1.79zM7.05 18.36a.996.996 0 000 1.41.996.996 0 001.41 0l1.79-1.79c.39-.39.39-1.02 0-1.41a.996.996 0 00-1.41 0l-1.79 1.79z"></path>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="moon-icon" viewBox="0 0 24 24">
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"></path>
                    </svg>
                </button>

                <div class="panel">
                    <h1>Legend</h1>
                    <div class="legend-item"><div class="color-box" style="background: var(--accent)"></div>Robot Pose</div>
                    <div class="legend-item"><div class="color-box" style="background: #f44336"></div>Trajectory</div>
                    <div class="legend-item"><div class="color-box" style="background: #2196f3; border: 1px dashed rgba(128,128,128,0.5)"></div>Planned Path</div>
                    <div class="legend-item"><div class="color-box" style="background: #00bcd4"></div>Lidar Scan</div>
                    <div class="legend-item"><div class="color-box" style="background: #666"></div>Map (Occupied)</div>
                </div>

                <div class="panel">
                    <h1>Controls</h1>
                    <button id="estop-btn" class="btn" style="width: 100%; background-color: var(--danger); color: white; border-color: var(--danger);">
                        <svg viewBox="0 0 24 24" style="margin-right: 6px;">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
                        </svg>
                        E-STOP (SPACE)
                    </button>
                </div>

                <div class="panel">
                    <button id="center-btn" class="btn" style="width: 100%">
                        <svg viewBox="0 0 24 24" style="margin-right: 6px;">
                            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path>
                        </svg>
                        Recenter
                    </button>
                    <div class="stat-row" style="margin-top: 8px; justify-content: center; text-align: center;">
                        <span class="stat-label" style="font-size: 11px;">Scroll to Zoom • Drag to Pan</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const WS_URL = `ws://${window.location.hostname}:8765`;
    
    // State (Moved up to be available for theme init)
    const state = {
        pose: { x: 0, y: 0, theta: 0 },
        trajectory: [],
        plannedVertices: [],
        lidarScan: [],
        map: null, // { width, height, resolution, origin, data: Uint8Array }
        imuHeadingDeg: null,
        connected: false,
        lastUpdate: 0
    };

    // Theme Management
    const themeConfig = {
        dark: {
            bg: '#111111',
            grid: '#2a2a2a',
            axis: '#444444',
            robot: '#4caf50',
            trajectory: '#f44336',
            plan: '#2196f3',
            lidar: '#00ffff',
            mapOccupied: [255, 255, 255], // Inverted for dark mode (drawing logic dependent)
            mapFree: [50, 50, 50],
        },
        light: {
            bg: '#f3f4f6',
            grid: '#e5e7eb',
            axis: '#d1d5db',
            robot: '#10b981',
            trajectory: '#ef4444',
            plan: '#3b82f6',
            lidar: '#0891b2',
            mapOccupied: [0, 0, 0],
            mapFree: [255, 255, 255],
        }
    };

    let currentTheme = localStorage.getItem('theme') || 'dark';
    
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        const sun = btn.querySelector('.sun-icon');
        const moon = btn.querySelector('.moon-icon');
        
        if (theme === 'dark') {
            sun.style.display = 'block';
            moon.style.display = 'none';
        } else {
            sun.style.display = 'none';
            moon.style.display = 'block';
        }
        
        localStorage.setItem('theme', theme);
        currentTheme = theme;
        
        // Re-process map if exists to match theme colors
        if (state.map) {
             updateMapTexture();
        }
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Initialize Theme
    applyTheme(currentTheme);

    // Viewport
    const view = {
        scale: 100, // pixels per meter
        centerX: 0, // world x at center of screen
        centerY: 0, // world y at center of screen
        isDragging: false,
        lastMouseX: 0,
        lastMouseY: 0
    };

    // DOM Elements
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const serverDot = document.getElementById('server-dot');
    const serverText = document.getElementById('server-text');
    const robotDot = document.getElementById('robot-dot');
    const robotText = document.getElementById('robot-text');
    const fpsValue = document.getElementById('fps-value');
    const poseValue = document.getElementById('pose-value');
    const headingValue = document.getElementById('heading-value');
    const imuValue = document.getElementById('imu-value');
    const centerBtn = document.getElementById('center-btn');
    const estopBtn = document.getElementById('estop-btn');

    // Stats
    let frameCount = 0;
    let lastFpsTime = 0;

    // E-Stop Logic
    let estopEnabled = false;
    
    function setEstopState(enabled) {
        estopEnabled = enabled;
        if (estopEnabled) {
             estopBtn.innerHTML = `
                <svg viewBox="0 0 24 24" style="margin-right: 6px; width: 16px; height: 16px; fill: currentColor;">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
                RESUME (SPACE)`;
             estopBtn.style.backgroundColor = "var(--accent)";
             estopBtn.style.borderColor = "var(--accent)";
        } else {
             estopBtn.innerHTML = `
                <svg viewBox="0 0 24 24" style="margin-right: 6px; width: 16px; height: 16px; fill: currentColor;">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
                </svg>
                E-STOP (SPACE)`;
             estopBtn.style.backgroundColor = "var(--danger)";
             estopBtn.style.borderColor = "var(--danger)";
        }
    }

    function toggleEstop() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const newState = !estopEnabled;
        setEstopState(newState); // Optimistic UI update
        ws.send(JSON.stringify({ type: 'estop', enabled: newState }));
    }

    estopBtn.addEventListener('click', toggleEstop);

    window.addEventListener('keydown', e => {
        if (e.code === 'Space') {
            e.preventDefault();
            toggleEstop();
        }
    });

    // Resize Handler
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    canvas.addEventListener('mousedown', e => {
        view.isDragging = true;
        view.lastMouseX = e.clientX;
        view.lastMouseY = e.clientY;
    });

    window.addEventListener('mousemove', e => {
        if (view.isDragging) {
            const dx = e.clientX - view.lastMouseX;
            const dy = e.clientY - view.lastMouseY;
            view.centerX -= dx / view.scale; // Invert for drag
            view.centerY += dy / view.scale; // Y is inverted in world->screen
            view.lastMouseX = e.clientX;
            view.lastMouseY = e.clientY;
        }
    });

    window.addEventListener('mouseup', () => view.isDragging = false);
    window.addEventListener('mouseleave', () => view.isDragging = false);
    
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoomFactor = 1.1;
        if (e.deltaY < 0) {
            view.scale *= zoomFactor;
        } else {
            view.scale /= zoomFactor;
        }
    }, { passive: false });

    centerBtn.addEventListener('click', () => {
        view.centerX = state.pose.x;
        view.centerY = state.pose.y;
    });

    // Coordinate Transform
    function worldToScreen(x, y) {
        const screenX = (x - view.centerX) * view.scale + canvas.width / 2;
        const screenY = -(y - view.centerY) * view.scale + canvas.height / 2;
        return { x: screenX, y: screenY };
    }

    // Map Decompression
    async function processMapData(mapPayload) {
        try {
            const binaryString = atob(mapPayload.data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            let gridData = bytes;
            if (mapPayload.encoding === 'gzip+base64') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                const buffer = await new Response(ds.readable).arrayBuffer();
                gridData = new Uint8Array(buffer);
            }

            state.map = {
                width: mapPayload.width,
                height: mapPayload.height,
                resolution: mapPayload.resolution,
                origin: mapPayload.origin,
                data: gridData
            };
            
            updateMapTexture();
            
        } catch (e) {
            console.error("Error processing map:", e);
        }
    }

    let mapTexture = null; // Offscreen canvas
    
    function updateMapTexture() {
        if (!state.map) return;
        
        const { width, height, data } = state.map;
        const offCanvas = document.createElement('canvas');
        offCanvas.width = width;
        offCanvas.height = height;
        const offCtx = offCanvas.getContext('2d');
        const imgData = offCtx.createImageData(width, height);
        const buf = imgData.data;
        
        const isDark = currentTheme === 'dark';
        
        for (let i = 0; i < width * height; i++) {
            const val = data[i];
            const idx = i * 4;
            
            if (val === 0) {
                // Unknown
                if (isDark) {
                     buf[idx] = 30; buf[idx+1] = 30; buf[idx+2] = 30; buf[idx+3] = 0; 
                } else {
                     buf[idx] = 240; buf[idx+1] = 240; buf[idx+2] = 240; buf[idx+3] = 0; 
                }
            } else if (val > 127) {
                // Occupied
                // Dark mode: Light pixels (inverted map look) or Dark? 
                // Usually SLAM maps: Black is occupied.
                // Let's stick to standard: Occupied = Dark/Black.
                // But in Dark Mode, Black on Dark Grey is invisible.
                // So in Dark Mode, Occupied should be lighter (grey) or keep it black but background is dark grey.
                
                // Let's use theme config
                // Val 128-255. 255 is definitely occupied.
                const intensity = 255 - val; // 0 for 255 (black)
                
                if (isDark) {
                    // In dark mode, walls should be visible against dark bg.
                    // Make walls lighter grey? Or keep them black?
                    // Let's make walls #666 or so.
                    buf[idx] = 100; buf[idx+1] = 100; buf[idx+2] = 100; buf[idx+3] = 255;
                } else {
                    // Light mode: walls are black.
                    buf[idx] = intensity; buf[idx+1] = intensity; buf[idx+2] = intensity; buf[idx+3] = 255;
                }
            } else {
                // Free
                // Light mode: White
                // Dark mode: Dark Grey (slightly lighter than bg)
                if (isDark) {
                    buf[idx] = 40; buf[idx+1] = 40; buf[idx+2] = 40; buf[idx+3] = 255;
                } else {
                    buf[idx] = 255; buf[idx+1] = 255; buf[idx+2] = 255; buf[idx+3] = 255;
                }
            }
        }
        
        offCtx.putImageData(imgData, 0, 0);
        mapTexture = offCanvas;
    }

    // WebSocket
    let ws;

    function connect() {
        ws = new WebSocket(WS_URL);
        
        ws.onopen = () => {
            state.connected = true;
            serverDot.className = 'dot connected';
            serverText.innerText = 'Connected';
            console.log('Connected to viewer server');
        };
        
        ws.onclose = () => {
            state.connected = false;
            serverDot.className = 'dot disconnected';
            serverText.innerText = 'Disconnected';
            setTimeout(connect, 1000);
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'estop') {
                    setEstopState(msg.enabled);
                }
                
                if (msg.type === 'triangle_update') {
                    if (msg.pose) {
                        state.pose = msg.pose;
                        // Auto-center on first receive if at 0,0
                        if (frameCount < 10 && state.pose.x !== 0) {
                             view.centerX = state.pose.x;
                             view.centerY = state.pose.y;
                        }
                    }
                    if (msg.trajectory) state.trajectory = msg.trajectory;
                    if (msg.plannedVertices) state.plannedVertices = msg.plannedVertices;
                    if (msg.lidarScan) state.lidarScan = msg.lidarScan;
                    if (msg.imuHeadingDeg !== undefined) state.imuHeadingDeg = msg.imuHeadingDeg;
                    
                    if (msg.map) {
                        await processMapData(msg.map);
                    }
                    
                    state.lastUpdate = Date.now();
                }
            } catch (e) {
                console.error("Error parsing msg:", e);
            }
        };
    }

    connect();

    // Rendering
    function drawGrid() {
        const theme = themeConfig[currentTheme];
        const gridSize = 1.0; // 1 meter
        const startX = Math.floor((view.centerX - (canvas.width/2)/view.scale) / gridSize) * gridSize;
        const endX = Math.ceil((view.centerX + (canvas.width/2)/view.scale) / gridSize) * gridSize;
        const startY = Math.floor((view.centerY - (canvas.height/2)/view.scale) / gridSize) * gridSize;
        const endY = Math.ceil((view.centerY + (canvas.height/2)/view.scale) / gridSize) * gridSize;

        ctx.strokeStyle = theme.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();

        for (let x = startX; x <= endX; x += gridSize) {
            const p = worldToScreen(x, 0);
            ctx.moveTo(p.x, 0);
            ctx.lineTo(p.x, canvas.height);
        }
        for (let y = startY; y <= endY; y += gridSize) {
            const p = worldToScreen(0, y);
            ctx.moveTo(0, p.y);
            ctx.lineTo(canvas.width, p.y);
        }
        ctx.stroke();

        // Axes
        ctx.strokeStyle = theme.axis;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const p0 = worldToScreen(0, 0);
        // X axis
        ctx.moveTo(0, p0.y);
        ctx.lineTo(canvas.width, p0.y);
        // Y axis
        ctx.moveTo(p0.x, 0);
        ctx.lineTo(p0.x, canvas.height);
        ctx.stroke();
    }

    function drawMap() {
        if (!state.map || !mapTexture) return;
        
        const { resolution, origin } = state.map;
        const worldX = origin.x;
        const worldY = origin.y; 
        
        const topLeftWorld = { x: worldX, y: worldY + state.map.height * resolution };
        const pTopLeft = worldToScreen(topLeftWorld.x, topLeftWorld.y);
        
        const screenWidth = state.map.width * resolution * view.scale;
        const screenHeight = state.map.height * resolution * view.scale;
        
        ctx.save();
        ctx.globalAlpha = 0.8;
        
        // Position and flip
        ctx.translate(pTopLeft.x, pTopLeft.y + screenHeight);
        ctx.scale(1, -1);
        
        ctx.drawImage(mapTexture, 0, 0, screenWidth, screenHeight);
        
        ctx.restore();
    }

    function drawTrajectory() {
        if (state.trajectory.length < 2) return;
        const theme = themeConfig[currentTheme];
        ctx.strokeStyle = theme.trajectory;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const start = worldToScreen(state.trajectory[0][0], state.trajectory[0][1]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < state.trajectory.length; i++) {
            const p = worldToScreen(state.trajectory[i][0], state.trajectory[i][1]);
            ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }

    function drawPlannedPath() {
        if (state.plannedVertices.length < 2) return;
        const theme = themeConfig[currentTheme];
        ctx.strokeStyle = theme.plan;
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        const v = state.plannedVertices;
        const start = worldToScreen(v[0][0], v[0][1]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < v.length; i++) {
            const p = worldToScreen(v[i][0], v[i][1]);
            ctx.lineTo(p.x, p.y);
        }
        if (v.length > 2) { 
             const end = worldToScreen(v[0][0], v[0][1]);
             ctx.lineTo(end.x, end.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawLidar() {
        if (!state.lidarScan.length) return;
        const theme = themeConfig[currentTheme];
        ctx.fillStyle = theme.lidar;
        const pose = state.pose;
        
        for (const point of state.lidarScan) {
            const angle = point[0];
            const dist = point[1];
            const wx = pose.x + dist * Math.cos(pose.theta + angle);
            const wy = pose.y + dist * Math.sin(pose.theta + angle);
            const p = worldToScreen(wx, wy);
            ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
        }
    }

    function drawRobot() {
        const theme = themeConfig[currentTheme];
        const p = worldToScreen(state.pose.x, state.pose.y);
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-state.pose.theta);
        
        // Body
        ctx.fillStyle = theme.robot;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Shadow/Glow
        ctx.shadowColor = theme.robot;
        ctx.shadowBlur = 10;
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Heading line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, 0);
        ctx.stroke();
        
        ctx.restore();
    }

    function loop() {
        // Update Stats
        const now = Date.now();
        frameCount++;
        if (now - lastFpsTime >= 1000) {
            fpsValue.innerText = frameCount;
            frameCount = 0;
            lastFpsTime = now;
        }
        
        poseValue.innerText = `${state.pose.x.toFixed(2)}, ${state.pose.y.toFixed(2)}`;
        headingValue.innerText = `${(state.pose.theta * 180 / Math.PI).toFixed(1)}°`;
        imuValue.innerText = state.imuHeadingDeg !== null ? `${state.imuHeadingDeg.toFixed(1)}°` : '--';

        // Robot Status Logic
        const timeSinceUpdate = now - state.lastUpdate;
        if (state.lastUpdate === 0) {
            robotDot.className = 'dot';
            robotText.innerText = 'Waiting...';
        } else if (timeSinceUpdate < 3000) {
            robotDot.className = 'dot active';
            robotText.innerText = 'Active';
        } else if (timeSinceUpdate < 10000) {
            robotDot.className = 'dot stale';
            robotText.innerText = 'Stale';
        } else {
            robotDot.className = 'dot lost';
            robotText.innerText = 'Lost';
        }

        // Draw
        const theme = themeConfig[currentTheme];
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid();
        drawMap();
        drawPlannedPath();
        drawTrajectory();
        drawLidar();
        drawRobot();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
