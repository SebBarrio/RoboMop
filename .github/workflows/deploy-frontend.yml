# Builds the RoboMop site and publishes it to GitHub Pages.
# The marketing landing page is served at the root; the React operator console
# is built and served under /app/ (the landing's "Open console" CTA links there).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main, Droid-implementation]
    paths:
      - frontend/**
      - landing/**
      - docs/proposal/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Assemble site (landing at root, console at /app, proposal at /proposal)
        shell: bash
        run: |
          mkdir -p _site/app _site/proposal
          cp -r landing/. _site/
          cp -r frontend/dist/. _site/app/
          cp -r docs/proposal/. _site/proposal/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
