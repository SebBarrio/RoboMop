name: CI

on:
  push:
    branches: ["main", "001-the-robomop-project"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Unit tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test

  robot:
    name: Robot Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: robot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit
      - name: Format check
        working-directory: robot
        run: black --check src tests
      - name: Lint
        working-directory: robot
        run: pylint src
      - name: Type check
        working-directory: robot
        run: mypy src
      - name: Tests
        working-directory: robot
        run: pytest
