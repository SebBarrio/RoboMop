# RoboMop relay — Cloudflare Worker + Durable Object WebSocket broker.
#
# Deploy:
#   cd relay
#   npm install
#   npx wrangler login
#   npx wrangler secret put ROBOT_TOKEN   # token the robot connects with
#   npx wrangler secret put APP_TOKEN     # token the web/mobile app connects with
#   npm run deploy
#
# Local dev:
#   copy .dev.vars.example .dev.vars   (edit tokens)
#   npm run dev                        # ws://localhost:8787

name = "robomop-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[[durable_objects.bindings]]
name = "ROBOT_ROOM"
class_name = "RobotRoom"

# SQLite-backed DO classes are required on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RobotRoom"]

[observability]
enabled = true
